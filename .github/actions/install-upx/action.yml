name: Install UPX (latest)
description: Downloads the latest UPX release from GitHub and installs to /usr/local/bin
runs:
  using: composite
  steps:
    - name: Install UPX
      shell: bash
      run: |
        UPX_VER=$(curl -s https://api.github.com/repos/upx/upx/releases/latest | jq -r .tag_name | sed 's/^v//')
        curl -sLo /tmp/upx.tar.xz "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_linux.tar.xz"
        tar -xf /tmp/upx.tar.xz -C /tmp
        sudo mv /tmp/upx-${UPX_VER}-amd64_linux/upx /usr/local/bin/
        upx --version
